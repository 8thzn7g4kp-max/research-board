<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research Board — 极简科研项目记录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
  </style>
</head>
<body class="h-screen flex overflow-hidden">

  <!-- 左侧：项目列表 -->
  <aside class="w-64 bg-white border-r border-slate-200 flex flex-col shrink-0">
    <div class="p-4 border-b border-slate-100">
      <h1 class="font-bold text-base text-slate-900 tracking-tight">Research Board</h1>
      <p class="text-xs text-slate-400 mt-0.5">极简项目进度与灵感记录</p>
    </div>

    <!-- 新建项目 -->
    <form id="addProjectForm" class="p-3 border-b border-slate-100 flex gap-1.5">
      <input id="newProjectName" type="text" required placeholder="新建项目名称..."
        class="flex-1 min-w-0 px-2.5 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-indigo-500" />
      <button type="submit"
        class="px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium rounded-lg shrink-0 transition">
        + 新建
      </button>
    </form>

    <!-- 项目列表容器 -->
    <div id="projectList" class="flex-1 overflow-y-auto p-2 space-y-1"></div>

    <!-- 底部数据备份 -->
    <div class="p-3 border-t border-slate-100 flex items-center justify-between gap-2 text-xs">
      <button id="btnExport" class="flex-1 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium transition">
        导出备份
      </button>
      <label class="flex-1 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium text-center cursor-pointer transition">
        导入数据
        <input id="inputImport" type="file" accept=".json" class="hidden" />
      </label>
    </div>
  </aside>

  <!-- 右侧：当前项目主区域 -->
  <main class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- 顶部项目标题栏 -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shrink-0">
      <div class="min-w-0">
        <h2 id="currentProjectTitle" class="text-lg font-bold text-slate-900 truncate">请选择或新建一个项目</h2>
      </div>
      <div id="projectActions" class="hidden flex items-center gap-2">
        <button id="btnRenameProject" class="px-2.5 py-1 text-xs text-slate-500 hover:text-indigo-600 hover:bg-slate-100 rounded-lg transition">重命名</button>
        <button id="btnDeleteProject" class="px-2.5 py-1 text-xs text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition">删除项目</button>
      </div>
    </header>

    <!-- 三栏内容区 -->
    <div id="workspaceContent" class="flex-1 overflow-y-auto p-6 hidden">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl mx-auto items-start">

        <!-- 1. 重要时间节点 -->
        <section class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm flex flex-col">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-bold text-sm text-slate-800">1. 重要时间节点</h3>
            <span id="milestoneCount" class="text-xs text-slate-400 font-mono">0</span>
          </div>

          <form id="addMilestoneForm" class="space-y-2 mb-4 pb-4 border-b border-slate-100">
            <div class="flex gap-2">
              <input id="milestoneDate" type="date" required
                class="w-36 px-2 py-1.5 text-xs font-mono bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-indigo-500" />
              <select id="milestoneTag"
                class="flex-1 px-2 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-indigo-500">
                <option value="投稿 Submit">投稿 Submit</option>
                <option value="返修 Revise">返修 Revise</option>
                <option value="截稿 DDL">截稿 DDL</option>
                <option value="录用 Accept">录用 Accept</option>
                <option value="拒稿 Reject">拒稿 Reject</option>
                <option value="其他节点">其他节点</option>
              </select>
            </div>
            <div class="flex gap-2">
              <input id="milestoneNote" type="text" placeholder="备注（如：投了 CVPR / 收到大修意见）..."
                class="flex-1 px-2.5 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-indigo-500" />
              <button type="submit"
                class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium rounded-lg shrink-0 transition">
                记录
              </button>
            </div>
          </form>

          <div id="milestoneList" class="space-y-3"></div>
        </section>

        <!-- 2. 任务规划 -->
        <section class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm flex flex-col">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-bold text-sm text-slate-800">2. 任务规划</h3>
            <span id="taskCount" class="text-xs text-slate-400 font-mono">0/0</span>
          </div>

          <form id="addTaskForm" class="space-y-2 mb-4 pb-4 border-b border-slate-100">
            <input id="taskTitle" type="text" required placeholder="下一步要做什么..."
              class="w-full px-2.5 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-indigo-500" />
            <div class="flex items-center justify-between gap-2">
              <input id="taskDue" type="date" title="截止日期（选填）"
                class="px-2 py-1 text-xs font-mono text-slate-600 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-indigo-500" />
              <button type="submit"
                class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium rounded-lg shrink-0 transition">
                添加任务
              </button>
            </div>
          </form>

          <div id="taskList" class="space-y-2"></div>
        </section>

        <!-- 3. 突发想法 / 以后试试 -->
        <section class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm flex flex-col">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-bold text-sm text-slate-800">3. 突发想法（以后试试）</h3>
            <span id="ideaCount" class="text-xs text-slate-400 font-mono">0</span>
          </div>

          <form id="addIdeaForm" class="space-y-2 mb-4 pb-4 border-b border-slate-100">
            <textarea id="ideaContent" rows="2" required placeholder="突然想到的点子、可以试的新方法..."
              class="w-full px-2.5 py-1.5 text-xs bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:outline-none focus:border-amber-500 resize-none"></textarea>
            <div class="flex justify-end">
              <button type="submit"
                class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white text-xs font-medium rounded-lg transition">
                记下来
              </button>
            </div>
          </form>

          <div id="ideaList" class="space-y-2.5"></div>
        </section>

      </div>
    </div>

    <!-- 空状态 -->
    <div id="emptyState" class="flex-1 flex items-center justify-center text-slate-400 text-sm">
      在左侧新建一个项目即可开始记录
    </div>
  </main>

  <script>
    const STORAGE_KEY = 'SIMPLE_RESEARCH_BOARD_V1';

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function esc(str) {
      return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // 初始化数据
    let state = { projects: [], activeId: null };

    function load() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        try {
          state = JSON.parse(raw);
        } catch (e) { console.error(e); }
      } else {
        // 首次打开给一个示例项目，方便直观看到效果
        const demoId = uid();
        state = {
          activeId: demoId,
          projects: [{
            id: demoId,
            name: '示例论文项目 A',
            milestones: [
              { id: uid(), date: todayStr(), tag: '投稿 Submit', note: '初稿投出' }
            ],
            tasks: [
              { id: uid(), title: '补两组消融实验', due: '', done: false }
            ],
            ideas: [
              { id: uid(), content: '之后可以试试换一个损失函数看效果', date: todayStr() }
            ]
          }]
        };
        save();
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getActiveProject() {
      return state.projects.find(p => p.id === state.activeId) || null;
    }

    // 渲染总控
    function render() {
      renderProjectList();
      const proj = getActiveProject();
      const workspace = document.getElementById('workspaceContent');
      const empty = document.getElementById('emptyState');
      const actions = document.getElementById('projectActions');
      const titleEl = document.getElementById('currentProjectTitle');

      if (!proj) {
        titleEl.textContent = '请选择或新建一个项目';
        workspace.classList.add('hidden');
        actions.classList.add('hidden');
        empty.classList.remove('hidden');
        return;
      }

      titleEl.textContent = proj.name;
      workspace.classList.remove('hidden');
      actions.classList.remove('hidden');
      empty.classList.add('hidden');

      renderMilestones(proj);
      renderTasks(proj);
      renderIdeas(proj);
    }

    function renderProjectList() {
      const el = document.getElementById('projectList');
      if (state.projects.length === 0) {
        el.innerHTML = `<div class="text-xs text-slate-400 text-center py-6">暂无项目</div>`;
        return;
      }
      el.innerHTML = state.projects.map(p => {
        const active = p.id === state.activeId;
        const pendingTasks = p.tasks.filter(t => !t.done).length;
        return `
          <button onclick="selectProject('${p.id}')"
            class="w-full text-left px-3 py-2 rounded-lg text-xs flex items-center justify-between gap-2 transition ${active ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-700 hover:bg-slate-100'}">
            <span class="truncate">${esc(p.name)}</span>
            ${pendingTasks > 0 ? `<span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-white text-slate-500 border border-slate-200 shrink-0">${pendingTasks}</span>` : ''}
          </button>
        `;
      }).join('');
    }

    function renderMilestones(proj) {
      const el = document.getElementById('milestoneList');
      document.getElementById('milestoneCount').textContent = proj.milestones.length;
      if (proj.milestones.length === 0) {
        el.innerHTML = `<div class="text-xs text-slate-400 text-center py-6">暂无时间节点</div>`;
        return;
      }
      const sorted = [...proj.milestones].sort((a, b) => b.date.localeCompare(a.date));
      const tagColors = {
        '投稿 Submit': 'bg-indigo-50 text-indigo-700 border-indigo-200',
        '返修 Revise': 'bg-amber-50 text-amber-700 border-amber-200',
        '截稿 DDL': 'bg-rose-50 text-rose-700 border-rose-200',
        '录用 Accept': 'bg-emerald-50 text-emerald-700 border-emerald-200',
        '拒稿 Reject': 'bg-slate-100 text-slate-600 border-slate-200',
        '其他节点': 'bg-slate-50 text-slate-700 border-slate-200'
      };
      el.innerHTML = sorted.map(m => `
        <div class="relative pl-4 border-l-2 border-slate-200 group">
          <span class="absolute -left-[5px] top-1.5 w-2 h-2 rounded-full bg-indigo-500"></span>
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-xs font-mono font-semibold text-slate-700">${esc(m.date)}</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded border font-medium ${tagColors[m.tag] || tagColors['其他节点']}">${esc(m.tag)}</span>
            </div>
            <button onclick="deleteMilestone('${m.id}')" class="opacity-0 group-hover:opacity-100 text-xs text-slate-400 hover:text-rose-600 transition">删除</button>
          </div>
          ${m.note ? `<p class="text-xs text-slate-600 mt-1 leading-relaxed">${esc(m.note)}</p>` : ''}
        </div>
      `).join('');
    }

    function renderTasks(proj) {
      const el = document.getElementById('taskList');
      const doneCount = proj.tasks.filter(t => t.done).length;
      document.getElementById('taskCount').textContent = `${doneCount}/${proj.tasks.length}`;
      if (proj.tasks.length === 0) {
        el.innerHTML = `<div class="text-xs text-slate-400 text-center py-6">暂无任务</div>`;
        return;
      }
      const sorted = [...proj.tasks].sort((a, b) => Number(a.done) - Number(b.done));
      el.innerHTML = sorted.map(t => `
        <div class="flex items-start gap-2.5 p-2 rounded-lg border ${t.done ? 'bg-slate-50 border-slate-100 opacity-60' : 'bg-white border-slate-200'} group">
          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask('${t.id}')"
            class="mt-0.5 w-4 h-4 accent-indigo-600 cursor-pointer shrink-0" />
          <div class="flex-1 min-w-0">
            <div class="text-xs ${t.done ? 'line-through text-slate-400' : 'text-slate-800'} break-words">${esc(t.title)}</div>
            ${t.due ? `<div class="text-[10px] font-mono text-slate-400 mt-0.5">DDL: ${esc(t.due)}</div>` : ''}
          </div>
          <button onclick="deleteTask('${t.id}')" class="opacity-0 group-hover:opacity-100 text-xs text-slate-400 hover:text-rose-600 shrink-0 transition">删除</button>
        </div>
      `).join('');
    }

    function renderIdeas(proj) {
      const el = document.getElementById('ideaList');
      document.getElementById('ideaCount').textContent = proj.ideas.length;
      if (proj.ideas.length === 0) {
        el.innerHTML = `<div class="text-xs text-slate-400 text-center py-6">暂无想法</div>`;
        return;
      }
      el.innerHTML = [...proj.ideas].reverse().map(i => `
        <div class="p-3 rounded-lg bg-amber-50/60 border border-amber-200/70 group">
          <p class="text-xs text-slate-800 whitespace-pre-wrap leading-relaxed">${esc(i.content)}</p>
          <div class="flex items-center justify-between mt-2 pt-1.5 border-t border-amber-200/40 text-[10px]">
            <span class="font-mono text-slate-400">${esc(i.date)}</span>
            <div class="flex items-center gap-2">
              <button onclick="ideaToTask('${i.id}')" class="text-amber-700 hover:underline font-medium">转为任务</button>
              <button onclick="deleteIdea('${i.id}')" class="text-slate-400 hover:text-rose-600">删除</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // 交互事件
    window.selectProject = (id) => {
      state.activeId = id;
      save();
      render();
    };

    document.getElementById('addProjectForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('newProjectName');
      const name = input.value.trim();
      if (!name) return;
      const newProj = { id: uid(), name, milestones: [], tasks: [], ideas: [] };
      state.projects.push(newProj);
      state.activeId = newProj.id;
      input.value = '';
      save();
      render();
    });

    document.getElementById('btnRenameProject').addEventListener('click', () => {
      const proj = getActiveProject();
      if (!proj) return;
      const newName = prompt('修改项目名称：', proj.name);
      if (newName && newName.trim()) {
        proj.name = newName.trim();
        save();
        render();
      }
    });

    document.getElementById('btnDeleteProject').addEventListener('click', () => {
      const proj = getActiveProject();
      if (!proj || !confirm(`确定删除项目「${proj.name}」及其所有记录吗？`)) return;
      state.projects = state.projects.filter(p => p.id !== proj.id);
      state.activeId = state.projects[0]?.id || null;
      save();
      render();
    });

    document.getElementById('addMilestoneForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const proj = getActiveProject();
      if (!proj) return;
      const date = document.getElementById('milestoneDate').value;
      const tag = document.getElementById('milestoneTag').value;
      const note = document.getElementById('milestoneNote').value.trim();
      if (!date) return;
      proj.milestones.push({ id: uid(), date, tag, note });
      document.getElementById('milestoneNote').value = '';
      save();
      render();
    });

    window.deleteMilestone = (id) => {
      const proj = getActiveProject();
      if (!proj) return;
      proj.milestones = proj.milestones.filter(m => m.id !== id);
      save();
      render();
    };

    document.getElementById('addTaskForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const proj = getActiveProject();
      if (!proj) return;
      const title = document.getElementById('taskTitle').value.trim();
      const due = document.getElementById('taskDue').value;
      if (!title) return;
      proj.tasks.push({ id: uid(), title, due, done: false });
      document.getElementById('taskTitle').value = '';
      document.getElementById('taskDue').value = '';
      save();
      render();
    });

    window.toggleTask = (id) => {
      const proj = getActiveProject();
      const task = proj?.tasks.find(t => t.id === id);
      if (!task) return;
      task.done = !task.done;
      save();
      render();
    };

    window.deleteTask = (id) => {
      const proj = getActiveProject();
      if (!proj) return;
      proj.tasks = proj.tasks.filter(t => t.id !== id);
      save();
      render();
    };

    document.getElementById('addIdeaForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const proj = getActiveProject();
      if (!proj) return;
      const content = document.getElementById('ideaContent').value.trim();
      if (!content) return;
      proj.ideas.push({ id: uid(), content, date: todayStr() });
      document.getElementById('ideaContent').value = '';
      save();
      render();
    });

    window.deleteIdea = (id) => {
      const proj = getActiveProject();
      if (!proj) return;
      proj.ideas = proj.ideas.filter(i => i.id !== id);
      save();
      render();
    };

    window.ideaToTask = (id) => {
      const proj = getActiveProject();
      const idea = proj?.ideas.find(i => i.id === id);
      if (!idea) return;
      proj.tasks.push({ id: uid(), title: idea.content, due: '', done: false });
      save();
      render();
    };

    // 导出与导入
    document.getElementById('btnExport').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `research-board-backup-${todayStr()}.json`;
      a.click();
    });

    document.getElementById('inputImport').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (Array.isArray(parsed.projects)) {
            state = parsed;
            save();
            render();
            alert('导入成功');
          }
        } catch (err) {
          alert('文件格式不对，请导入有效的 JSON 备份');
        }
        e.target.value = '';
      };
      reader.readAsText(file);
    });

    // 启动
    document.getElementById('milestoneDate').value = todayStr();
    load();
    render();
  </script>
</body>
</html>
